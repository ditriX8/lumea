<!doctype html>
<meta charset="utf-8" />
<title>cutout helper</title>
<script type="module">
  import { removeBackground } from '@imgly/background-removal'
  window.cut = async (dataUrl) => {
    const blob = await (await fetch(dataUrl)).blob()
    const out = await removeBackground(blob, { model: 'isnet_fp16', output: { format: 'image/png' }, progress: (k, c, t) => { if (c === t) console.log('done', k) } })
    return await new Promise((res) => {
      const fr = new FileReader()
      fr.onload = () => res(fr.result)
      fr.readAsDataURL(out)
    })
  }
  window.ready = true
</script>
